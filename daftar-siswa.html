<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f1f6ff">
  <title>Pendaftaran Siswa | Absensi Sekolah">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 22px;
      font-family: Arial, sans-serif;
      background: #f3f7ff;
      color: #243b63;
    }

    .container {
      width: 100%;
      max-width: 460px;
      background: white;
      padding: 32px 28px;
      border-radius: 23px;
      box-shadow: 0 12px 35px #456a9915;
      animation: muncul .5s ease;
    }

    @keyframes muncul {
      from {
        opacity: 0;
        transform: translateY(15px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .header {
      text-align: center;
      margin-bottom: 28px;
    }

    .logo {
      width: 65px;
      height: 65px;
      display: grid;
      place-items: center;
      margin: 0 auto 15px;
      border-radius: 19px;
      background: #e4efff;
      font-size: 30px;
    }

    h1 {
      color: #244a85;
      font-size: 24px;
      margin-bottom: 9px;
    }

    .deskripsi {
      color: #8190a7;
      font-size: 13px;
      line-height: 1.6;
    }

    .foto {
      text-align: center;
      margin-bottom: 25px;
    }

    .foto-bulat {
      width: 85px;
      height: 85px;
      display: grid;
      place-items: center;
      margin: auto;
      border-radius: 50%;
      background: #edf3ff;
      border: 2px dashed #a9c6f0;
      font-size: 32px;
    }

    .foto p {
      margin-top: 10px;
      font-size: 12px;
      color: #71819b;
    }

    .form-group {
      margin-bottom: 19px;
    }

    label {
      display: block;
      margin-bottom: 9px;
      font-size: 13px;
      font-weight: bold;
      color: #405779;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #dce6f5;
      border-radius: 11px;
      outline: none;
      font-size: 14px;
      background: #fbfdff;
      color: #243b63;
    }

    input:focus {
      border-color: #75a7ed;
      box-shadow: 0 0 0 3px #dceaff;
    }

    .lanjut {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: #4d85d6;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 8px;
      transition: .2s;
    }

    .lanjut:hover {
      background: #376fbd;
      transform: translateY(-2px);
    }

    .kembali {
      display: block;
      margin-top: 20px;
      text-align: center;
      color: #6d8dbb;
      font-size: 13px;
      text-decoration: none;
    }

    @media(prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>

<body>
  <main class="container">

    <header class="header">
      <div class="logo">🎓</div>
      <h1>Data Siswa</h1>
      <p class="deskripsi">
        Lengkapi identitas siswa untuk melanjutkan
        ke sistem absensi sekolah.
      </p>
    </header>

    <div class="foto">
      <div class="foto-bulat">👤</div>
      <p>Foto profil dapat ditambahkan nanti</p>
    </div>

    <form id="formSiswa">
      <div class="form-group">
        <label for="nama">Nama Lengkap</label>
        <input
          type="text"
          id="nama"
          placeholder="Masukkan nama lengkap"
          required
        >
      </div>

      <div class="form-group">
        <label for="absen">Nomor Absen</label>
        <input
          type="number"
          id="absen"
          placeholder="Masukkan nomor absen"
          min="1"
          max="50"
          required
        >
      </div>

      <button type="submit" class="lanjut">
        Lanjutkan
      </button>
    </form>

    <a href="pilih-peran.html" class="kembali">
      ← Kembali
    </a>

  </main>

  <script>
    document.getElementById("formSiswa").addEventListener("submit", function(e) {
      e.preventDefault();
      alert("Tampilan formulir berhasil. Sistem penyimpanan akan dihubungkan nanti.");
    });
  </script>
</body>
</html>
