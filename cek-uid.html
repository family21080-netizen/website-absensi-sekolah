<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pemeriksaan UID</title>
</head>
<body>
  <h2>Pemeriksaan Akun</h2>
  <p id="status">Memeriksa akun...</p>
  <p id="uid"></p>

  <script type="module">
    import { auth } from "./js/firebase.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/13.3.0/firebase-auth.js";

    onAuthStateChanged(auth, (pengguna) => {
      const status = document.getElementById("status");
      const uid = document.getElementById("uid");

      if (pengguna) {
        status.textContent = "Akun berhasil ditemukan.";
        uid.textContent = "UID: " + pengguna.uid;
      } else {
        status.textContent = "Belum login. Silakan login terlebih dahulu.";
      }
    });
  </script>
</body>
  </html>
