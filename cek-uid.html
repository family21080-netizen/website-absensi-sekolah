<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pemeriksaan Akun</title>
</head>
<body>
  <h2>Pemeriksaan Akun</h2>
  <p id="status">Memeriksa akun...</p>
  <p id="hasil"></p>

  <script type="module">
    import { auth, db } from "./js/firebase.js";

    import {
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/13.3.0/firebase-auth.js";

    import {
      doc, getDoc
    } from "https://www.gstatic.com/firebasejs/13.3.0/firebase-firestore.js";

    const status = document.getElementById("status");
    const hasil = document.getElementById("hasil");

    onAuthStateChanged(auth, async (pengguna) => {
      if (!pengguna) {
        status.textContent = "Belum login.";
        return;
      }

      status.textContent = "Memeriksa profil...";

      try {
        const referensi = doc(
  db,
  "sekolah",
  "utama",
  "pengguna",
  pengguna.uid
);
        const dokumen = await getDoc(referensi);

        if (!dokumen.exists()) {
  status.textContent = "Dokumen profil tidak ditemukan.";

  hasil.textContent =
    "UID akun yang sedang login: " + pengguna.uid;

  return;
}

        const data = dokumen.data();

console.log("Data profil:", data);

const nama = data["Nama lengkap "] || "Kosong";
const email = data.email || "Kosong";
const peran = Array.isArray(data.peran)
  ? data.peran.join(", ")
  : data.peran || "Kosong";
const akun = data["Status akun "] || "Kosong";

console.log("Nama lengkap:", nama);
console.log("Email:", email);
console.log("Peran:", peran);
console.log("Status akun:", akun);

status.textContent =
  "Profil berhasil ditemukan.\n\n" +
  "UID: " + pengguna.uid +
  "\nNama: " + nama +
  "\nEmail: " + email +
  "\nPeran: " + peran +
  "\nStatus akun: " + akun;
        hasil.style.whiteSpace = "pre-wrap";

hasil.textContent =
"UID: " + pengguna.uid +
"\n\nDATA PROFIL FIRESTORE:\n" +
JSON.stringify(data, null, 2);

      } catch (error) {
        status.textContent = "Gagal membaca profil.";
        hasil.textContent = error.code || error.message;
        console.error(error);
      }
    });
  </script>
</body>
  </html>
