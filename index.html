<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#edf4ff">
  <title>Login - Absensi Sekolah</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      color: #263b59;
      background: linear-gradient(135deg, #edf4ff, #dceaff);
    }

    .container {
      width: 100%;
      max-width: 420px;
      padding: 38px 30px;
      text-align: center;
      background: #fff;
      border: 1px solid #e4edfa;
      border-radius: 22px;
      box-shadow: 0 12px 35px rgba(57, 91, 140, .10);
    }

    .logo {
      width: 76px;
      height: 76px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 22px;
      border-radius: 22px;
      color: #fff;
      background: linear-gradient(135deg, #4389e8, #2864bd);
      font-size: 34px;
      font-weight: bold;
    }

    h1 {
      margin-bottom: 10px;
      font-size: 25px;
      color: #24466f;
    }

    .description {
      margin-bottom: 28px;
      color: #7b8da6;
      font-size: 14px;
      line-height: 1.6;
    }

    .google-button,
    .logout-button {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 14px;
      border: 1px solid #dce5f1;
      border-radius: 12px;
      background: #fff;
      color: #344b68;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: .2s;
    }

    .google-button:hover,
    .logout-button:hover {
      background: #f5f8fd;
      border-color: #9dbce5;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .google-icon {
      width: 20px;
      height: 20px;
    }

    #status {
      min-height: 22px;
      margin-top: 20px;
      color: #6480a2;
      font-size: 13px;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .logout-button {
      display: none;
      margin-top: 12px;
      color: #b54747;
      border-color: #f0dada;
    }

    .footer {
      margin-top: 30px;
      padding-top: 18px;
      border-top: 1px solid #edf1f7;
      color: #98a7ba;
      font-size: 12px;
    }

    @media (max-width: 480px) {
      .container {
        padding: 32px 22px;
      }

      h1 {
        font-size: 23px;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <div class="logo">A</div>

    <h1>Absensi Sekolah</h1>

    <p class="description">
      Selamat datang di sistem informasi absensi sekolah.
      Silakan masuk menggunakan akun Google.
    </p>

    <button class="google-button" id="googleLogin" type="button">
      <svg class="google-icon" viewBox="0 0 48 48"
           xmlns="http://www.w3.org/2000/svg">
        <path fill="#EA4335"
          d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
        <path fill="#4285F4"
          d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.93c-.58 2.96-2.25 5.48-4.72 7.18l7.72 5.99c4.51-4.18 7.05-10.32 7.05-17.64z"/>
        <path fill="#FBBC05"
          d="M10.54 28.59A14.5 14.5 0 0 1 9.77 24c0-1.59.27-3.13.77-4.59l-7.98-6.19A23.9 23.9 0 0 0 0 24c0 3.88.93 7.56 2.56 10.78l7.98-6.19z"/>
        <path fill="#34A853"
          d="M24 48c6.48 0 11.93-2.13 15.9-5.81l-7.72-5.99c-2.14 1.44-4.89 2.3-8.18 2.3-6.26 0-11.57-4.22-13.46-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
      </svg>
      Masuk dengan Google
    </button>

    <p id="status" aria-live="polite">
      Silakan masuk menggunakan akun Google.
    </p>

    <button class="logout-button" id="logoutButton" type="button">
      Keluar dari akun ini
    </button>

    <div class="footer">
      Sistem Informasi Absensi Sekolah
    </div>

  </main>

  <script type="module">
    import {
      loginGoogle,
      pantauLogin,
      logout
    } from "./js/auth.js";

    import {
      doc,
      getDoc
    } from "https://www.gstatic.com/firebasejs/13.3.0/firebase-firestore.js";

    import { db } from "./js/firebase.js";

    const button = document.getElementById("googleLogin");
    const status = document.getElementById("status");
    const logoutButton = document.getElementById("logoutButton");

    let sedangMengalihkan = false;
    let sedangMemeriksa = false;

    function tampilkanLogout() {
      logoutButton.style.display = "flex";
    }

    async function periksaProfil(user) {
      if (sedangMengalihkan || sedangMemeriksa) return;

      sedangMemeriksa = true;
      button.disabled = true;
      logoutButton.style.display = "none";

      status.textContent = "Memeriksa akun dan hak akses...";

      try {
        const profileRef = doc(
          db,
          "sekolah",
          "utama",
          "pengguna",
          user.uid
        );

        const profileSnap = await getDoc(profileRef);

        // Akun belum mempunyai profil.
        if (!profileSnap.exists()) {
          status.textContent =
            "Akun belum terdaftar. Mengarahkan ke pilihan pendaftaran...";

          sedangMengalihkan = true;

          window.location.replace("./pilih-peran.html");
          return;
        }

        const profile = profileSnap.data();

        const peran = Array.isArray(profile.peran)
          ? profile.peran
          : [profile.peran];

        const statusAkun = profile.statusAkun;

        if (statusAkun !== "aktif") {
          status.textContent =
            "Akun ditemukan, tetapi belum aktif. Hubungi pengelola sekolah.";

          tampilkanLogout();
          return;
        }

        // Pengembang dan Admin Utama.
        if (
          peran.includes("developer_admin") ||
          peran.includes("super_admin")
        ) {
          status.textContent =
            "Akses pengelola berhasil. Membuka halaman pengelolaan...";

          sedangMengalihkan = true;

          window.location.replace("./persetujuan-guru.html");
          return;
        }

        // Akun lain sudah terdaftar, jangan diarahkan ke pendaftaran ulang.
        if (
          peran.includes("admin") ||
          peran.includes("guru") ||
          peran.includes("siswa")
        ) {
          status.textContent =
            "Akun sudah terdaftar. Halaman dashboard untuk peran ini belum disambungkan.";

          tampilkanLogout();
          return;
        }

        status.textContent =
          "Peran akun tidak dikenali. Silakan hubungi pengelola.";

        tampilkanLogout();

      } catch (error) {
        console.error("Pemeriksaan profil gagal:", error);

        status.textContent =
          "Gagal memeriksa profil: " +
          (error.message || "Periksa koneksi dan izin Firestore.");

        tampilkanLogout();

      } finally {
        sedangMemeriksa = false;

        if (!sedangMengalihkan) {
          button.disabled = false;
        }
      }
    }

    button.addEventListener("click", async () => {
      button.disabled = true;
      status.textContent = "Menghubungkan ke Google...";

      try {
        await loginGoogle();
      } catch (error) {
        console.error("Login gagal:", error);

        status.textContent =
          "Login gagal: " + (error.message || "Terjadi kesalahan.");

        button.disabled = false;
      }
    });

    logoutButton.addEventListener("click", async () => {
      logoutButton.disabled = true;
      status.textContent = "Keluar dari akun Google...";

      try {
        await logout();
      } catch (error) {
        console.error("Logout gagal:", error);
        status.textContent = "Gagal keluar: " + error.message;
        logoutButton.disabled = false;
      }
    });

    pantauLogin((user) => {
      if (user) {
        periksaProfil(user);
      } else {
        sedangMengalihkan = false;
        sedangMemeriksa = false;

        button.disabled = false;
        logoutButton.style.display = "none";

        status.textContent =
          "Silakan masuk menggunakan akun Google.";
      }
    });
  </script>

</body>
</html>
