
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2563eb">

  <title>Login | Absensi Sekolah</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #eaf2ff, #f8fafc);
      color: #172554;
    }

    .container {
      width: 100%;
      max-width: 420px;
      background: #ffffff;
      border-radius: 22px;
      padding: 35px 28px;
      box-shadow: 0 15px 45px rgba(37, 99, 235, 0.12);
      text-align: center;
    }

    .logo {
      width: 75px;
      height: 75px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      border-radius: 22px;
      background: #e8f0ff;
      font-size: 34px;
    }

    h1 {
      font-size: 26px;
      margin-bottom: 10px;
      color: #1e3a8a;
    }

    .description {
      font-size: 14px;
      line-height: 1.7;
      color: #64748b;
      margin-bottom: 28px;
    }

    .google-button {
      width: 100%;
      padding: 15px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      border: 1px solid #dbe3ef;
      border-radius: 12px;
      background: white;
      color: #334155;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    .google-button:hover {
      background: #f1f5f9;
      border-color: #93b4f8;
    }

    .google-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .google-icon {
      width: 21px;
      height: 21px;
    }

    #status {
      min-height: 24px;
      margin-top: 20px;
      font-size: 13px;
      line-height: 1.5;
      overflow-wrap: anywhere;
      color: #64748b;
    }

    .footer {
      margin-top: 28px;
      padding-top: 20px;
      border-top: 1px solid #edf0f5;
      font-size: 12px;
      color: #94a3b8;
    }

    @media (max-width: 480px) {
      .container {
        padding: 30px 22px;
      }

      h1 {
        font-size: 23px;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <div class="logo">📚</div>

    <h1>Absensi Sekolah</h1>

    <p class="description">
      Selamat datang di sistem informasi sekolah.
      Silakan masuk menggunakan akun Google
      yang telah terdaftar.
    </p>

    <button
      type="button"
      class="google-button"
      id="googleLogin"
    >
      <svg class="google-icon"
        viewBox="0 0 48 48"
        aria-hidden="true">
        <path fill="#EA4335"
          d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
        <path fill="#4285F4"
          d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.25 5.48-4.73 7.18l7.34 5.7c4.29-3.96 7.43-9.8 7.43-17.35z"/>
        <path fill="#FBBC05"
          d="M10.53 28.59a14.5 14.5 0 0 1 0-9.18l-7.98-6.19a23.94 23.94 0 0 0 0 21.56l7.98-6.19z"/>
        <path fill="#34A853"
          d="M24 48c6.47 0 11.9-2.13 15.87-5.8l-7.34-5.7c-2.04 1.37-4.65 2.18-8.53 2.18-6.26 0-11.57-4.22-13.46-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
      </svg>

      Masuk dengan Google
    </button>

    <p id="status" role="status" aria-live="polite">
      Silakan masuk untuk melanjutkan.
    </p>

    <div class="footer">
      Sistem Informasi Absensi Sekolah
    </div>

  </main>

  <script type="module">

    import {
      loginGoogle,
      pantauLogin
    } from "./js/auth.js";

    const button = document.getElementById("googleLogin");
    const status = document.getElementById("status");

    // Tombol login Google
    button.addEventListener("click", async () => {

      button.disabled = true;
      status.textContent = "Menghubungkan ke Google...";

      try {

        await loginGoogle();

      } catch (error) {

        console.error("Login gagal:", error);

        status.textContent =
          "Login gagal: " + error.message;

        button.disabled = false;

      }

    });

    // Memantau status login pengguna
    

/**
 * @param {import("https://www.gstatic.com/firebasejs/13.3.0/firebase-auth.js").User | null} user
 */
function handleLoginState(user) {
  if (user) {
    status.textContent =
      "Berhasil masuk: " + user.email;
  } else {
    status.textContent =
      "Silakan masuk menggunakan Google.";
  }
}

pantauLogin(handleLoginState);



  </script>

</body>
</html>
